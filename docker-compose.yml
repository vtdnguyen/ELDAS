services:

  cloudsim-java:
    build:
      context: ./cloudsim-java
      dockerfile: Dockerfile
    container_name: cloudsim
    ports:
      - "${PY4J_PORT}:${PY4J_PORT}"
      # T5.3 — Publish the Prometheus exporter so `curl localhost:9091/metrics`
      # works from the host for ad-hoc debugging. Internally, Prometheus
      # scrapes through the sim-net bridge regardless of this mapping.
      - "${METRICS_PORT:-9091}:${METRICS_PORT:-9091}"
    volumes:
      # :ro = read-only, Java chỉ đọc data chứ không ghi
      - trace-data:/data/trace:ro
      - results:/data/results
    environment:
      - PY4J_PORT=${PY4J_PORT}
      - RANDOM_SEED=${RANDOM_SEED}
      # T5.3 — Prometheus exporter (no-op unless MONITORING_ENABLED=true).
      # Defaults below let the stack run unchanged when .env doesn't set them.
      - MONITORING_ENABLED=${MONITORING_ENABLED:-false}
      - METRICS_PORT=${METRICS_PORT:-9091}
      # T7.1 — Topology override (default-on-miss inside Java).
      - NUM_HOSTS=${NUM_HOSTS:-10}
      - VCPU_PER_HOST=${VCPU_PER_HOST:-64}
      - GPU_PER_HOST=${GPU_PER_HOST:-8}
      - RAM_PER_HOST_GB=${RAM_PER_HOST_GB:-256}
      - MIPS_PER_PE=${MIPS_PER_PE:-10000}
      - CPU_MAX_WATT=${CPU_MAX_WATT:-400}
      - CPU_IDLE_WATT=${CPU_IDLE_WATT:-120}
      - GPU_MAX_WATT=${GPU_MAX_WATT:-300}
      - GPU_IDLE_WATT=${GPU_IDLE_WATT:-30}
      # T8.1 — Host state-machine knobs.
      - IDLE_THRESHOLD_SEC=${IDLE_THRESHOLD_SEC:-30}
      - P_SUSPENDED_W=${P_SUSPENDED_W:-10}
      - WAKE_ENERGY_KWH=${WAKE_ENERGY_KWH:-0.0005}
      - WAKE_LATENCY_SEC=${WAKE_LATENCY_SEC:-5}
    networks:
      - sim-net
    # Healthcheck: thử kết nối port Py4J mỗi 10 giây
    # Nếu fail 3 lần liên tiếp → container bị đánh dấu "unhealthy"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/${PY4J_PORT}' && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  rl-agent:
    build:
      context: ./rl-agent
      dockerfile: Dockerfile
    container_name: rl-agent
    # rl-agent chỉ khởi động SAU KHI cloudsim-java healthy
    # Không có điều này, Python kết nối Py4J khi Java chưa sẵn sàng → crash
    depends_on:
      cloudsim-java:
        condition: service_healthy
    volumes:
      - results:/data/results
      - model-store:/data/models
    environment:
      # Python dùng tên service "cloudsim-java" để tìm IP — Docker DNS tự resolve
      - GATEWAY_HOST=cloudsim-java
      - GATEWAY_PORT=${PY4J_PORT}
      - ENERGY_WEIGHT=${ENERGY_WEIGHT}
      - SLA_WEIGHT=${SLA_WEIGHT}
      - WANDB_API_KEY=${WANDB_API_KEY}
      - RANDOM_SEED=${RANDOM_SEED}
    networks:
      - sim-net

  # ─────────────────────────────────────────────────────────────────────────
  # T5.1 — Observability stack (opt-in).
  #
  # Both services live under the `monitoring` profile, so they are SKIPPED
  # by default. `docker compose up` boots only cloudsim-java + rl-agent.
  # To boot the full stack:
  #     docker compose --profile monitoring up
  #
  # Neither service is in any other service's `depends_on`. If monitoring
  # fails to start, the simulation runs unaffected.
  # ─────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: eldas-prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sim-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.1
    container_name: eldas-grafana
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Default credentials — override via .env for non-local use.
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      # Disable anonymous + sign-up to keep things explicit even on localhost.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Skip the "set new password" wall the first time you log in.
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
    volumes:
      # Provisioning: datasource + dashboard provider definitions.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Persistent storage for users, prefs, edits.
      - grafana-data:/var/lib/grafana
    networks:
      - sim-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  # bind mount: map thư mục thật trên máy host vào container
  trace-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/alibaba-trace

  # named volume: Docker tự quản lý, dữ liệu tồn tại kể cả sau khi container xóa
  results:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/results   # ← maps to ELDAS/data/results/ on your host
  
  model-store:

  # T5.1 — Persistent storage for the optional monitoring stack.
  prometheus-data:
  grafana-data:

networks:
  sim-net:
    driver: bridge